global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: quizpulse-api          # request rate, latency, prediction distribution, model version
    metrics_path: /metrics
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: quizpulse-monitor      # rolling AUC, PSI per feature, drift flag, retrain counters
    metrics_path: /metrics
    static_configs: [{ targets: ["monitor:8100"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
