groups:
  - name: quizpulse-alerts
    rules:
      - alert: ApiDown
        expr: up{job="quizpulse-api"} == 0
        for: 15s
        labels: { severity: critical }
        annotations: { summary: "QuizPulse API is down" }
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(qp_http_request_seconds_bucket{endpoint="/predict"}[1m])) by (le)) > 0.5
        for: 30s
        labels: { severity: warning }
        annotations: { summary: "p95 /predict latency above 500 ms" }
      - alert: DataDriftDetected
        expr: qp_drift_detected == 1
        for: 10s
        labels: { severity: warning }
        annotations: { summary: "Input drift detected - retraining should trigger" }
      - alert: RollingAucLow
        expr: qp_rolling_auc < 0.70 and qp_rolling_labeled_rows > 300
        for: 30s
        labels: { severity: warning }
        annotations: { summary: "Live AUC below 0.70" }
      - alert: ErrorRateHigh
        expr: sum(rate(qp_http_requests_total{status=~"5.."}[1m])) / sum(rate(qp_http_requests_total[1m])) > 0.05
        for: 30s
        labels: { severity: critical }
        annotations: { summary: "More than 5% of API requests fail" }
