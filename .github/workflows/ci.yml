name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: Unit + API tests
        run: pytest -q --junitxml=reports/test_report.xml
      - name: Run the data + training pipeline (pandas engine) and check the acceptance criterion
        env:
          MLFLOW_TRACKING_URI: sqlite:///ci-mlflow.db
        run: |
          python -m src.data.synthetic_generator
          python -m src.data.ingest
          python -m src.data.make_batches
          python -m src.features.build_features --engine pandas
          python -m src.models.train
          python -m src.models.register          # fails if best AUC does not beat the baseline by 0.02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t quizpulse-backend:ci .
      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t quizpulse-frontend:ci .
      - name: Validate compose file
        run: docker compose config -q
